<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Karl System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: #1e293b; border: 1px solid #334155; padding: 32px; border-radius: 12px; width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-header { text-align: center; margin-bottom: 24px; }
        .login-header h2 { font-size: 22px; margin-bottom: 6px; }
        .login-header p { font-size: 13px; color: #94a3b8; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; outline: none; }
        .btn-submit { width: 100%; padding: 10px; background: #4f46e5; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 10px; }
        .btn-submit:hover { background: #4338ca; }
        .demo-accounts { margin-top: 20px; padding: 12px; background: #0f172a; border-radius: 6px; font-size: 11px; color: #94a3b8; border: 1px dashed #334155; }
        .demo-accounts strong { color: #818cf8; }
        .error-msg { color: #ef4444; font-size: 12px; margin-top: 8px; display: none; text-align: center; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>🎓 Karl System</h2>
            <p>Hệ thống Quản lý Đào tạo & Sinh viên</p>
        </div>

        <form id="formLogin">
            <div class="form-group">
                <label>Tên đăng nhập / Email</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập..." required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <div id="errorMsg" class="error-msg">⚠️ Sai tài khoản hoặc mật khẩu!</div>
            <button type="submit" class="btn-submit">🔑 Đăng nhập</button>
        </form>

        <div class="demo-accounts">
            <p style="margin-bottom: 4px; font-weight: bold;">💡 Tài khoản thử nghiệm (Mật khẩu: 123456):</p>
            • Admin: <strong>admin</strong><br>
            • Giảng viên: <strong>giangvien</strong><br>
            • Sinh viên: <strong>sinhvien</strong>
        </div>
    </div>

    <script>
        const defaultUsers = [
            { username: 'admin', password: '123456', hoTen: 'Quản trị viên', email: 'admin@truong.edu.vn', role: 'Admin' },
            { username: 'giangvien', password: '123456', hoTen: 'ThS. Nguyễn Văn A', email: 'gv.nguyenvana@truong.edu.vn', role: 'Giảng viên' },
            { username: 'sinhvien', password: '123456', hoTen: 'Trần Văn B', email: 'sv.tranvanb@truong.edu.vn', role: 'Sinh viên' }
        ];

        let danhSachUsers = JSON.parse(localStorage.getItem('danhSachUsers')) || defaultUsers;
        localStorage.setItem('danhSachUsers', JSON.stringify(danhSachUsers));

        document.getElementById('formLogin').onsubmit = (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            const userFound = danhSachUsers.find(user => (user.username === u || user.email === u) && user.password === p);

            if (userFound) {
                localStorage.setItem('currentUser', JSON.stringify({
                    username: userFound.username,
                    name: userFound.hoTen,
                    role: userFound.role,
                    email: userFound.email
                }));
                window.location.href = 'index.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        };
    </script>
</body>
</html>
